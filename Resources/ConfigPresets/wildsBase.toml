# Base configuration preset for SS14 Persistence. On the official server this is loaded before wilds.toml
# Related docs https://docs.spacestation14.com/en/general-development/tips/config-file-reference.html

[game]
hostname = "[NRP] Wilds Sector 14 Test Server"
desc = "Don't mind me, just using the base ConfigPreset!"
defaultpreset = "wilds"
soft_max_players = 30
autosaveinterval = 60

[hub]
tags = "rp:none"

[infolinks]
#bug_report = "https://github.com/michaelchessall/SS14-Persistence/issues/new/choose"
#discord    = "https://discord.gg/PRjRkAN5NU"
github     = "https://github.com/Nitro2030ce/wilds-sector-14"

[server]
id = "Wilds-Sector-14"

[funkystation.reagent_fire]
puddle_damage_multiplier = 0.1

[funkystation.cpr]
rib_crack_damage = 20
rib_crack_pump = 10

[funkystation.defib]
revive_chance = 0.7
adrenaline_cost = 1
